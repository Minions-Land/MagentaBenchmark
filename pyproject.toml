[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "magentabench"
version = "0.1.0"
description = "Benchmark-side protocol contracts and tooling"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3",
  "tomli>=2; python_version < '3.11'",
  "jsonschema>=4.23,<5",
]

[project.scripts]
bmp-verify-report = "MagentaBench.schemas.verification:main"
bmp-verify-probe = "MagentaBench.schemas.verification:probe_main"
bmp-verify-authority = "MagentaBench.schemas.verification:authority_main"
bmp-compile = "MagentaBench.runner.cli:compile_main"
bmp-run = "MagentaBench.runner.cli:run_main"
bmp-config = "MagentaBench.runner.configuration_cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["MagentaBench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
