[benchmark]
id = "deterministic-evolution.v1"
kind = "custom"
adapter = "deterministic_evolution"
bmp_version = "0.1"
source = "../../MagentaBench/conformance/fixtures/deterministic_evolution"
commit = "deterministic-evolution-v1"
content_globs = [
  "public-input.json",
  "search-evaluator.json",
  "search-split.json",
  "holdout-split.json",
]
verifier = "deterministic-evolution.holdout"
scoring_kind = "continuous"
