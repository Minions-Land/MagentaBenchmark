protocol_id = "fake.repeated-sampling.v1"
metric_ids = [
  "reward.authoritative.v1",
  "pass-at-1.infra-zero.task-bootstrap.v1",
  "pass-at-2.unbiased.v1",
  "pass-power-2.reliability.v1",
  "empirical-any-at-2.v1",
  "empirical-all-at-2.v1",
  "expected-max-at-2.v1",
