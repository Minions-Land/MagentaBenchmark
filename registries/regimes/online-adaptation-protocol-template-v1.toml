[regime]
id = "online-adaptation.protocol-template.v1"
kind = "regime"
adapter = "magentabench.stage-dag"
bmp_version = "0.1"
regime_kind = "online_adaptation"

[[regime.stages]]
id = "pre-update-score-1"
role = "evaluate"
benchmark_id = "fake.exact.v1"
dataset_id = "dataset.fake.exact.v1"
evaluator_id = "evaluator.fake.exact.v1"
protocol_id = "fake.checkpoint-lineage.v1"
metric_ids = [
  "reward.authoritative.v1",
  "pass-at-1.infra-zero.v1",
]
domains = ["stream-step-1"]
state_policy = "reset"
feedback_visibility = "evaluator_feedback"
sealed = false
evaluation_cadence = 1

[regime.stages.budget]
max_tokens = 0
max_wall_seconds = 1.0
max_cost = 0.0

[[regime.stages]]
id = "adapt-after-score-1"
role = "adapt"
predecessors = ["pre-update-score-1"]
benchmark_id = "fake.exact.v1"
dataset_id = "dataset.fake.exact.v1"
evaluator_id = "evaluator.fake.exact.v1"
protocol_id = "fake.checkpoint-lineage.v1"
metric_ids = [
  "reward.authoritative.v1",
  "pass-at-1.infra-zero.v1",
]
domains = ["stream-step-1"]
state_policy = "carry"
feedback_visibility = "full_trajectory"
sealed = false
evaluation_cadence = 1

[regime.stages.budget]
max_tokens = 0
max_wall_seconds = 1.0
max_cost = 0.0

[[regime.stages]]
id = "pre-update-score-2"
role = "evaluate"
predecessors = ["adapt-after-score-1"]
benchmark_id = "fake.exact.v1"
dataset_id = "dataset.fake.exact.v1"
evaluator_id = "evaluator.fake.exact.v1"
protocol_id = "fake.deterministic.v1"
metric_ids = [
  "reward.authoritative.v1",
  "pass-at-1.infra-zero.v1",
]
domains = ["stream-step-2"]
state_policy = "read_only"
feedback_visibility = "evaluator_feedback"
sealed = false
evaluation_cadence = 1

[regime.stages.budget]
max_tokens = 0
max_wall_seconds = 1.0
max_cost = 0.0

[[regime.stages]]
id = "adapt-after-score-2"
role = "adapt"
predecessors = ["adapt-after-score-1", "pre-update-score-2"]
benchmark_id = "fake.exact.v1"
dataset_id = "dataset.fake.exact.v1"
evaluator_id = "evaluator.fake.exact.v1"
protocol_id = "fake.checkpoint-lineage.v1"
metric_ids = [
  "reward.authoritative.v1",
  "pass-at-1.infra-zero.v1",
]
domains = ["stream-step-2"]
state_policy = "carry"
feedback_visibility = "full_trajectory"
sealed = false
evaluation_cadence = 1

[regime.stages.budget]
max_tokens = 0
max_wall_seconds = 1.0
max_cost = 0.0

[[regime.stages]]
id = "frozen-final-evaluate"
role = "evaluate"
predecessors = ["adapt-after-score-2"]
benchmark_id = "fake.exact.v1"
dataset_id = "dataset.fake.exact.v1"
evaluator_id = "evaluator.fake.exact.v1"
protocol_id = "fake.deterministic.v1"
metric_ids = [
  "reward.authoritative.v1",
  "pass-at-1.infra-zero.v1",
]
domains = ["stream-retention"]
state_policy = "read_only"
feedback_visibility = "aggregate_only"
sealed = false
evaluation_cadence = 1

[regime.stages.budget]
max_tokens = 0
max_wall_seconds = 1.0
max_cost = 0.0
