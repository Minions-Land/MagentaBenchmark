[regime]
id = "generalization.protocol-template.v1"
kind = "regime"
adapter = "magentabench.stage-dag"
bmp_version = "0.1"
regime_kind = "generalization"

[[regime.stages]]
id = "id-validation"
role = "validation"
benchmark_id = "fake.exact.v1"
dataset_id = "dataset.fake.exact.v1"
evaluator_id = "evaluator.fake.exact.v1"
protocol_id = "fake.deterministic.v1"
metric_ids = [
  "reward.authoritative.v1",
  "pass-at-1.infra-zero.v1",
]
domains = ["in-distribution"]
state_policy = "reset"
feedback_visibility = "aggregate_only"
sealed = false
evaluation_cadence = 1

[regime.stages.budget]
max_tokens = 0
max_wall_seconds = 1.0
max_cost = 0.0

[[regime.stages]]
id = "ood-holdout"
role = "holdout"
predecessors = ["id-validation"]
benchmark_id = "fake.exact.v1"
dataset_id = "dataset.fake.exact.v1"
evaluator_id = "evaluator.fake.exact.v1"
protocol_id = "fake.deterministic.v1"
metric_ids = [
  "reward.authoritative.v1",
  "pass-at-1.infra-zero.v1",
]
domains = ["out-of-distribution"]
state_policy = "read_only"
feedback_visibility = "none"
sealed = true
evaluation_cadence = 1

[regime.stages.budget]
max_tokens = 0
max_wall_seconds = 1.0
max_cost = 0.0
