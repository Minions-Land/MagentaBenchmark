[metric]
id = "pass-at-1.infra-zero.task-bootstrap.v1"
kind = "metric"
adapter = "magentabench.measurement"
bmp_version = "0.1"
value_kind = "rate"
level = "configuration"
direction = "maximize"
unit = "fraction"
source = "evaluator"
source_field = "authoritative_reward"
formula = "pass_at_1_v1"
population = "planned_rollouts"
group_by = ["task"]
across_groups = "macro_mean"
missing_observation = "zero"

[metric.uncertainty]
method = "bootstrap_percentile_v1"
confidence_level = 0.95
resampling_unit = "task"
cluster_by = ["task"]
resamples = 2000
seed = 20260810
rng_algorithm = "sha256_counter_v1"

[metric.status_policy]
pass = "observe"
verified_fail = "observe"
scored = "observe"
no_output = "zero"
invalid_output = "zero"
timeout = "zero"
agent_error = "zero"
harness_fault = "zero"
verifier_error = "zero"
infra_error = "zero"
unsupported = "zero"
