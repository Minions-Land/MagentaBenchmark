[metric]
id = "tool-error-rate.v1"
kind = "metric"
adapter = "magentabench.measurement"
bmp_version = "0.1"
value_kind = "rate"
level = "configuration"
direction = "minimize"
unit = "errors/tool-call"
source = "derived"
formula = "ratio_v1"
population = "observed_rollouts"
inputs = ["tool-errors.mean-completed.v1", "tool-calls.mean-completed.v1"]
missing_observation = "invalidate"
