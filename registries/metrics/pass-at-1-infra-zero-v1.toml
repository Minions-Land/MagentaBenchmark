[metric]
id = "pass-at-1.infra-zero.v1"
kind = "metric"
adapter = "magentabench.measurement"
bmp_version = "0.1"
value_kind = "rate"
level = "configuration"
direction = "maximize"
unit = "fraction"
source = "evaluator"
source_field = "authoritative_reward"
formula = "pass_at_1_v1"
population = "planned_rollouts"
missing_observation = "zero"

[metric.uncertainty]
method = "wilson_score_v1"
confidence_level = 0.95
resampling_unit = "rollout"

[metric.status_policy]
pass = "observe"
verified_fail = "observe"
scored = "observe"
no_output = "zero"
invalid_output = "zero"
timeout = "zero"
agent_error = "zero"
harness_fault = "zero"
verifier_error = "zero"
infra_error = "zero"
unsupported = "zero"
