[metric]
id = "wall-time.mean-completed.v1"
kind = "metric"
adapter = "magentabench.measurement"
bmp_version = "0.1"
value_kind = "duration"
level = "configuration"
direction = "minimize"
unit = "seconds"
source = "usage"
source_field = "wall_clock_seconds"
formula = "mean_v1"
population = "completed_rollouts"
missing_observation = "invalidate"

[metric.status_policy]
pass = "observe"
verified_fail = "observe"
scored = "observe"
no_output = "observe"
invalid_output = "observe"
timeout = "observe"
agent_error = "observe"
harness_fault = "observe"
verifier_error = "observe"
infra_error = "exclude"
unsupported = "exclude"
