[protocol]
id = "native-benchmark.conformance.v1"
kind = "mechanism_validation"
adapter = "magentabench.scheduler"
bmp_version = "0.1"
rollouts_per_case = 1
parallelism = 1
case_order = "explicit"
explicit_case_ids = ["case-one"]
adaptive_budget = false
candidate_selection = "single"
state_reset = "per_rollout"
checkpoint_policy = "disabled"
deterministic_conformance = false

[protocol.budget]
max_tokens = 0
max_wall_seconds = 5.0
max_cost = 0.0
