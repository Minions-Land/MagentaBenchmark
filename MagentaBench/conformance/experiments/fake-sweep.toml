[experiment]
id = "fake-conformance-sweep"
benchmark = "fake.exact.v1"
dataset = "dataset.fake.exact.v1"
evaluator = "evaluator.fake.exact.v1"
metrics = [
  "reward.authoritative.v1",
  "pass-at-1.infra-zero.v1",
  "tokens.mean-completed.v1",
  "input-tokens.mean-completed.v1",
  "output-tokens.mean-completed.v1",
  "cache-read-tokens.mean-completed.v1",
  "cache-write-tokens.mean-completed.v1",
  "cost.mean-completed.v1",
  "wall-time.mean-completed.v1",
  "model-calls.mean-completed.v1",
  "tool-calls.mean-completed.v1",
  "throughput.completed-per-hour.v1",
  "successes-per-million-tokens.v1",
]
subject = "fake.control"
protocol = "fake.deterministic.v1"
factors = ["conformance.fake-subject", "repetition.four"]

[experiment.contrast]
mode = "one_factor"
factor_id = "conformance.fake-subject"
control_level = "control"
treatment_level = "treatment"
counterbalanced = true

[experiment.design]
purpose = "exploratory"

[execution]
backend = "fake.local"
model = "none/deterministic"

[execution.budget]
max_tokens = 0
max_wall_seconds = 1.0
max_cost = 0.0
