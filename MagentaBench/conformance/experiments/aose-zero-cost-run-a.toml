[experiment]
id = "aose-zero-cost-run-a"
benchmark = "aosebench.biomnibench-da.v1"
dataset = "dataset.aosebench.biomnibench-da.v1"
evaluator = "evaluator.aosebench.rubric-judge.v1"
metrics = [
  "reward.authoritative.v1",
  "tokens.mean-completed.v1",
  "input-tokens.mean-completed.v1",
  "output-tokens.mean-completed.v1",
  "cache-read-tokens.mean-completed.v1",
  "cache-write-tokens.mean-completed.v1",
  "cost.mean-completed.v1",
  "wall-time.mean-completed.v1",
  "model-calls.mean-completed.v1",
  "tool-calls.mean-completed.v1",
  "throughput.completed-per-hour.v1",
]
subject = "aose.dryrun.true"
protocol = "aose.zero-cost-dryrun.v1"

[experiment.design]
comparison_kind = "coding_agent"
purpose = "exploratory"

[execution]
backend = "aose.docker.immutable"
model = "none"

[execution.budget]
max_tokens = 0
max_wall_seconds = 120.0
max_cost = 0.0
