[experiment]
id = "native-benchmark-continuous-smoke"
benchmark = "native-benchmark.conformance.v1"
dataset = "dataset.native-benchmark.conformance.v1"
evaluator = "evaluator.native-benchmark.continuous-conformance.v1"
metrics = [
  "reward.authoritative.v1",
  "tokens.mean-completed.v1",
  "cost.mean-completed.v1",
  "wall-time.mean-completed.v1",
  "model-calls.mean-completed.v1",
  "tool-calls.mean-completed.v1",
]
subject = "native-benchmark.conformance-driver"
protocol = "native-benchmark.conformance.v1"

[experiment.design]
comparison_kind = "agent"
purpose = "exploratory"

[execution]
backend = "native-process.local.v1"
model = "none/deterministic"

[execution.budget]
max_tokens = 0
max_wall_seconds = 5.0
max_cost = 0.0
