[experiment]
id = "subprocess-echo-smoke"
benchmark = "fake.exact.v1"
subject = "fake.control"
protocol = "subprocess.deterministic.v1"
allowed_diff = [
  "subject.artifact_digest",
  "subject.fixed_answer",
  "subject.id",
]

[experiment.contrast]
mode = "one_factor"
control_id = "fake.control"
treatment_id = "fake.treatment"
counterbalanced = true

[experiment.design]
scope = "conformance"
purpose = "exploratory"
vary = []

[execution]
backend = "subprocess.echo"
model = "none/echo"
seed = 41

[execution.budget]
max_tokens = 0
max_wall_seconds = 2.0
max_cost = 0.0

[factors]
subject = ["fake.control", "fake.treatment"]
repetition = [0, 1]
