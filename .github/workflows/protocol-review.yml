name: BMP protocol review gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bmp-protocol-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-paths:
    name: Detect protocol paths
    runs-on: ubuntu-latest
    outputs:
      protocol: ${{ steps.detect.outputs.protocol }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          protocol=false
          while IFS= read -r path; do
            case "$path" in
              MagentaBench/adapters/*|MagentaBench/schemas/*|MagentaBench/runner/*|plugins/*|registries/*|pyproject.toml|uv.lock)
                protocol=true
                ;;
            esac
          done < <(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          printf 'protocol=%s\n' "$protocol" >> "$GITHUB_OUTPUT"

  require-explicit-approval:
    name: Protocol review required gate
    needs: changed-paths
    if: always()
    runs-on: ubuntu-latest
    env:
      CHANGED_PATHS_RESULT: ${{ needs.changed-paths.result }}
      PROTOCOL_CHANGED: ${{ needs.changed-paths.outputs.protocol }}
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_REPOSITORY: ${{ github.repository }}
      REQUIRED_REVIEWER: PoorOtterBob
    steps:
      - name: Require changed-path detection
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHANGED_PATHS_RESULT" != "success" ]]; then
            echo "Protocol path detection failed: $CHANGED_PATHS_RESULT" >&2
            exit 1
          fi
      - name: Record that protocol approval is not required
        if: env.PROTOCOL_CHANGED != 'true'
        run: echo "No protected BMP protocol path changed."
      - name: Require the protocol impact declaration
        if: env.PROTOCOL_CHANGED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fqi -- "[x] I have requested PoorOtterBob review" <<<"${PR_BODY:-}" \
            && ! grep -Fqi -- "[x] I completed PoorOtterBob self-review" <<<"${PR_BODY:-}"; then
            echo "Core BMP paths changed, but the PR does not declare a protocol review path." >&2
            echo "Check the protocol review items in the PR template." >&2
            exit 1
          fi
      - name: Require PoorOtterBob approval or authorized self-review
        if: env.PROTOCOL_CHANGED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          reviews="$(
            gh api --paginate --slurp \
              "repos/${PR_REPOSITORY}/pulls/${PR_NUMBER}/reviews"
          )"
          approved="$(
            jq -r \
              --arg head "$HEAD_SHA" \
              --arg required "$REQUIRED_REVIEWER" \
              '
                add
                | map(select(
                    .state == "APPROVED"
                    or .state == "CHANGES_REQUESTED"
                    or .state == "DISMISSED"
                  ))
                | group_by(.user.login)
                | map(max_by(.id))
                | map(select(
                    .state == "APPROVED"
                    and .commit_id == $head
                    and .user.login == $required
                  ))
                | map(.user.login)
                | unique
                | join(", ")
              ' <<<"$reviews"
          )"
          if [[ -n "$approved" ]]; then
            echo "Current PoorOtterBob approval: $approved"
            exit 0
          fi

          # The repository owner permits PoorOtterBob to attest to their own
          # protocol review. This is attributable self-review, not an
          # independent GitHub approval, and it names the exact immutable head
          # so a new push invalidates the attestation.
          if [[ "$PR_AUTHOR" == "$REQUIRED_REVIEWER" ]] \
            && grep -Fqi -- "[x] I completed PoorOtterBob self-review" <<<"${PR_BODY:-}" \
            && grep -Fq -- "Protocol self-review HEAD: \`$HEAD_SHA\`" <<<"${PR_BODY:-}"; then
            echo "Authorized author self-review attested by $PR_AUTHOR for $HEAD_SHA"
            exit 0
          fi

          echo "A current PoorOtterBob approval or an authorized author self-review for $HEAD_SHA is required." >&2
          echo "Other collaborator reviews are advisory only; self-review must use the exact checkbox and HEAD line from the PR template." >&2
          exit 1
